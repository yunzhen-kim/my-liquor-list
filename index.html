<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 술창고</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
:root{
  --bg:#f1efe8; --surface:#fbfaf6; --ink:#1f2a28; --muted:#5f6b67; --line:#cfcabb; --brass:#8a6a25;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121c1b; --surface:#1b2927; --ink:#ece7d8; --muted:#9aa8a3; --line:#33463f; --brass:#d1ad66;}
}
:root[data-theme="dark"]{--bg:#121c1b; --surface:#1b2927; --ink:#ece7d8; --muted:#9aa8a3; --line:#33463f; --brass:#d1ad66;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.65 "Noto Sans KR",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 18px 56px}
h1{font:700 30px/1.25 "Noto Serif KR",serif;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 28px}
.cat{margin-top:30px}
.cat>summary{cursor:pointer;list-style:none;font:700 20px/1.3 "Noto Serif KR",serif;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--brass);display:flex;align-items:baseline}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary::before{content:"▾";color:var(--brass);margin-right:8px}
.cat:not([open])>summary::before{content:"▸"}
.cat:not([open])>summary{margin-bottom:0}
.cat>summary small{margin-left:auto;font:500 13px "Noto Sans KR",sans-serif;color:var(--muted)}
.cat>summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h2 small{font:500 13px "Noto Sans KR",sans-serif;color:var(--muted)}
.bottle{display:grid;grid-template-columns:96px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.bottle img{width:96px;height:128px;object-fit:cover;border-radius:3px}
.bottle h3{font:700 17px/1.35 "Noto Serif KR",serif;margin:0 0 6px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
dt{color:var(--muted)} dd{margin:0}
.est{color:var(--brass);font-size:12px;margin-left:4px}
.note{margin:8px 0 0;font-size:14px}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 8px}
.summary button{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 6px;text-align:center;color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,transform .1s}
.summary button:hover{border-color:var(--brass)}
.summary button:active{transform:scale(.97)}
.summary button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.cat>summary.flash-cat{animation:flashcat 1.4s ease}
@keyframes flashcat{0%,40%{color:var(--brass)}100%{color:inherit}}
.cat{scroll-margin-top:12px}
.summary span{display:block;font-size:12px;color:var(--muted)}
.summary b{font:700 18px/1.3 "Noto Serif KR",serif}
.summary .total{border-color:var(--brass)}
@media (max-width:420px){.summary{gap:6px}.summary b{font-size:16px}}
.story{margin:8px 0 0;font-size:13.5px;color:var(--muted);border-left:2px solid var(--brass);padding-left:8px}
.story span{display:block;font-size:12px;color:var(--brass);font-weight:500}
.brand-desc{margin:-4px 0 12px;font-size:14px;color:var(--muted)}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:16px;margin:0}

.subcat{margin:4px 0 18px}
.subcat>summary,.region>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline}
.subcat>summary::-webkit-details-marker,.region>summary::-webkit-details-marker{display:none}
.subcat>summary{font:700 18px/1.35 "Noto Serif KR",serif;padding:6px 0;margin-bottom:8px;border-bottom:1px solid var(--brass)}
.region>summary{font:500 15px/1.4 "Noto Sans KR",sans-serif;color:var(--brass);padding:6px 0 4px;margin-bottom:4px}
.subcat>summary::before,.region>summary::before{content:"▾";color:var(--brass);margin-right:8px}
.subcat:not([open])>summary::before,.region:not([open])>summary::before{content:"▸"}
.subcat>summary small,.region>summary small{margin-left:auto;font:500 13px "Noto Sans KR",sans-serif;color:var(--muted)}
.region{margin:0 0 6px}
.region>.brand,.region>.indie{margin-left:12px}
.indie>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;font:500 14px/1.4 "Noto Sans KR",sans-serif;color:var(--muted);padding:6px 0 4px;margin-bottom:4px;border-top:1px dashed var(--line)}
.indie>summary::-webkit-details-marker{display:none}
.indie>summary::before{content:"▾";color:var(--brass);margin-right:8px}
.indie:not([open])>summary::before{content:"▸"}
.indie>summary small{margin-left:auto;font:500 13px "Noto Sans KR",sans-serif;color:var(--muted)}
.indie>.brand{margin-left:12px}
@media (max-width:420px){.region>.brand{margin-left:6px}}
.brand{margin-bottom:10px}
.brand>summary{cursor:pointer;font:700 16px/1.4 "Noto Serif KR",serif;padding:8px 0;display:flex;justify-content:space-between;align-items:baseline;list-style:none;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand>summary::-webkit-details-marker{display:none}
.brand>summary::before{content:"▾";color:var(--brass);margin-right:8px}
.brand:not([open])>summary::before{content:"▸"}
.brand>summary small{margin-left:auto;font:500 13px "Noto Sans KR",sans-serif;color:var(--muted)}
.brand>summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

#chat-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:6px;padding:12px 16px;border-radius:999px;border:0;background:var(--brass);color:var(--bg);font:500 15px "Noto Sans KR",sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#chat{position:fixed;z-index:30;right:16px;bottom:16px;width:380px;max-width:calc(100vw - 32px);height:min(600px,calc(100vh - 32px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.2);overflow:hidden}
#chat[hidden]{display:none}
#chat header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
#chat header b{font:700 16px "Noto Serif KR",serif}
#chat-mode{font-size:12px;color:var(--brass);margin-right:auto}
#chat header button,#chat-settings button,#chat-chips button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:4px 10px;font:13px "Noto Sans KR",sans-serif;cursor:pointer}
#chat-settings{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
#chat-settings p{margin:0 0 8px}
#chat-settings input{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:14px monospace}
#chat-settings .row{display:flex;gap:8px;margin-top:8px}
#chat-log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:8px 12px;border-radius:10px;font-size:14px;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--brass);color:var(--bg)}
.msg.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.hits{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.hits button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px;color:var(--ink);cursor:pointer;font:inherit}
.hits img{width:36px;height:48px;object-fit:cover;border-radius:3px;flex:none}
.hits b{display:block;font-weight:500;font-size:13.5px;line-height:1.35}
.hits small{color:var(--muted);font-size:12px}
.more{margin:6px 0 0;font-size:12px;color:var(--muted)}
#chat-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
#chat-chips[hidden]{display:none}
#chat-form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
#chat-in{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:16px "Noto Sans KR",sans-serif}
#chat-form button{border:0;border-radius:8px;background:var(--brass);color:var(--bg);width:44px;font-size:18px;cursor:pointer}
.bottle.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass)}100%{box-shadow:none}}
@media (max-width:700px){#chat{right:0;left:0;bottom:0;width:auto;max-width:none;height:80vh;border-radius:12px 12px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}}
main{padding-bottom:96px}
</style>
</head>
<body>
<main>
  <h1>나의 술창고</h1>
  <p class="sub">종류별, 브랜드별로 정리했습니다. 브랜드는 알파벳순, 브랜드 안에서는 고급 병이 위에 옵니다.</p>
  <div id="summary" class="summary"></div>
  <div id="app"></div>
</main>
<script>
const CATEGORIES = ["꼬냑", "블렌디드 위스키", "싱글몰트 위스키", "버번 위스키", "와인", "기타 증류주"];

// 브랜드 설명. 새 브랜드를 추가하면 여기에도 한 줄 넣으세요.
const BRANDS = {
 "Hwayo": "도자기 브랜드 광주요가 2005년 선보인 증류식 소주. 국산 쌀을 감압 증류해 깔끔한 맛을 낸다.",
 "Camus": "1863년 장-바티스트 카뮈가 세운 꼬냑 하우스로, 지금도 카뮈 가문이 운영한다. 보르드리 원액의 꽃향이 특징.",
 "Courvoisier": "1809년 파리에서 시작해 1835년 자르낙으로 옮긴 꼬냑 하우스. 나폴레옹이 세인트헬레나로 쿠르부아지에 꼬냑을 가져갔다는 이야기로 '나폴레옹의 꼬냑'을 내세운다.",
 "Frapin": "1270년부터 그랑드 샹파뉴에 뿌리내린 프라팽 가문의 하우스. 자사 포도밭의 그랑드 샹파뉴 원액만 쓴다. 작가 라블레의 어머니가 이 가문 출신.",
 "Hennessy": "1765년 아일랜드 출신 리처드 헤네시가 세운 세계 최대 꼬냑 하우스. 1870년 처음 'XO' 등급을 만들었다.",
 "Martell": "1715년 저지섬 출신 장 마르텔이 세운, 메이저 꼬냑 하우스 중 가장 오래된 곳. 보르드리 원액 비중이 높아 꽃·견과 풍미가 특징.",
 "Otard": "1795년 바롱 장-바티스트 오타르가 세운 하우스. 프랑수아 1세가 태어난 꼬냑 성(Château de Cognac)에서 원액을 숙성한다.",
 "Rémy Martin": "1724년 레미 마르탱이 세운 하우스. 그랑드·쁘띠뜨 샹파뉴 원액만 쓰는 '샹파뉴 꼬냑' 전문으로, Louis XIII로 유명하다.",
 "Ballantine's": "1827년 에든버러의 식료품상 조지 밸런타인에서 시작한 블렌디드 스카치. 밀튼더프·글렌버기 몰트가 맛의 중심이다.",
 "Bell's": "퍼스의 아서 벨 앤 선즈가 키운 블렌디드 스카치. 블레어 아솔 몰트가 핵심 원액이다.",
 "Dunhill": "영국 럭셔리 브랜드 알프레드 던힐의 이름으로 나온 프리미엄 블렌디드 스카치.",
 "Johnnie Walker": "1820년 존 워커가 킬마녹에 연 식료품점에서 시작한 세계 최대 스카치 블렌디드 브랜드. 1909년 레드·블랙 라벨 이름과 '걸어가는 신사' 로고가 정착했다.",
 "Nikka": "'일본 위스키의 아버지' 타케츠루 마사타카가 1934년 홋카이도 요이치에 세운 회사. 1969년 미야기쿄 증류소를 더했다.",
 "Royal Salute": "1953년 엘리자베스 2세 대관식을 기념해 시바스 브라더스가 만든 브랜드. 21발 예포에서 이름을 따 21년 이상 원액만 쓴다.",
 "Sansibar": "독일 질트섬의 레스토랑 Sansibar 이름을 단 독일 독립 병입자. 개성 있는 일러스트 라벨로 알려져 있다.",
 "Whyte & Mackay": "1882년 글래스고에서 설립된 블렌디드 스카치 회사. 원액을 섞은 뒤 다시 캐스크에서 숙성하는 방식으로 유명하며 달모어를 소유한다.",
 "Balvenie": "1892년 윌리엄 그랜트가 글렌피딕 옆에 세운 스페이사이드 증류소. 자체 플로어 몰팅과 쿠퍼·구리 장인을 지금도 유지한다.",
 "Bunnahabhain": "1881년 아일라 북동쪽 해안에 세운 증류소. 피트가 강한 아일라에서 드물게 논피트 위주의 부드러운 몰트를 만든다.",
 "Clynelish": "북부 하이랜드 브로라의 증류소(1967년 신설). 왁스처럼 기름진 질감과 과일향이 특징이며 조니워커 골드 라벨의 핵심 몰트다.",
 "Dalmore": "1839년 설립된 북부 하이랜드 증류소. 1263년 매켄지 가문의 조상이 수사슴에게서 왕을 구했다는 이야기에서 수사슴 엠블럼이 나왔다. 셰리 숙성의 진한 스타일.",
 "Edradour": "1825년 퍼스셔에 세운, 스코틀랜드에서 가장 작은 전통 증류소 중 하나. 시그너토리 빈티지가 소유하고 있다.",
 "GlenAllachie": "1967년 설립된 스페이사이드 증류소. 2017년 빌리 워커 등이 인수한 뒤 셰리·와인 캐스크를 적극 쓰는 독자 브랜드로 자리 잡았다.",
 "GlenDronach": "1826년 제임스 알라다이스가 세운 하이랜드 증류소. 올로로소·PX 셰리 캐스크 숙성의 대표 주자다.",
 "Glenfiddich": "1887년 윌리엄 그랜트가 더프타운에 세운 증류소. 1960년대 싱글몰트를 해외에 알린 선구자이며 지금도 가족 경영이다.",
 "Glengoyne": "1833년 설립, 하이랜드와 로우랜드 경계의 증류소. 피트 없이 공기로 말린 보리와 느린 증류로 깔끔한 맛을 낸다.",
 "Glenlivet": "1824년 조지 스미스가 초기 합법 면허를 받아 세운 스페이사이드 증류소. 꽃·과일향의 스페이사이드 스타일을 대표한다.",
 "Glenmorangie": "1843년 설립된 하이랜드 증류소. 스코틀랜드에서 가장 키가 큰 증류기와 다양한 캐스크 실험으로 유명하다.",
 "Glenturret": "1763년 기록이 남아 있는, 스코틀랜드에서 가장 오래된 현역 증류소를 자처하는 곳. 2019년 랄리크 그룹이 인수했다.",
 "Macallan": "1824년 면허를 받은 스페이사이드 증류소. 작은 증류기와 셰리 시즈닝 오크 캐스크로 진한 셰리 스타일을 대표한다. 라벨의 저택은 이스터 엘키스 하우스.",
 "Mars": "1872년 창업한 소주 회사 혼보 주조의 위스키 브랜드. 나가노 신슈 증류소와 2016년 문을 연 가고시마 쓰누키 증류소를 운영한다.",
 "Signatory Vintage": "1988년 앤드루 시밍턴이 세운 스코틀랜드 독립 병입자. 에드라두어 증류소를 소유하고 있다.",
 "Springbank": "1828년 캠벨타운에 세운 증류소로 미첼 가문이 경영한다. 플로어 몰팅부터 병입까지 전 과정을 자체에서 한다.",
 "Caymus": "1972년 와그너 가문이 나파 밸리 러더퍼드에 세운 와이너리. 진하고 부드러운 카베르네 소비뇽으로 유명하다.",
 "Trapiche": "1883년 아르헨티나 멘도사에서 시작한, 아르헨티나 최대급 와이너리. 우코 밸리 같은 고지대 포도밭 와인으로 유명하다.",
 "Château Talbot": "1855년 보르도 등급에서 4등급을 받은 생쥘리앙 샤토. 백년전쟁 때 영국 장군 존 탈보트의 이름에서 유래했다고 전해지며 코르디에 가문이 소유한다.",
 "Ki One": "2020년 경기 남양주에 문을 연 한국 첫 싱글몰트 증류소 쓰리소사이어티스의 위스키 브랜드.",
 "Suntory": "1899년 토리이 신지로가 오사카에서 시작한 일본 최대 위스키 회사. 1923년 일본 최초의 몰트 증류소인 야마자키를 세웠다. 1950년 나온 '산토리 올드'는 둥근 검은 병 모양 때문에 '다루마'라는 애칭으로 불린다.",

  "eraBasis": "병 바닥의 750ml 각인(미국 미터법 용량 도입 이후)과 지금의 80 proof보다 높은 90 proof 표기 기준",
  "notes": "옥수수 중심의 사워 매시로 증류한 뒤, 사탕단풍나무 숯에 한 방울씩 걸러 숙성하는(링컨 카운티 공정) 테네시 위스키. 지금보다 도수가 높던 90 proof(45%)·750ml 올드 보틀로, 창업자 초상이 들어간 박스 포함.",

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function card(b){
  return `
    <article class="bottle" id="b${BOTTLES.indexOf(b)}">
      ${b.image ? `<img src="${b.image}" alt="${esc(b.name)}">` : "<div></div>"}
      <div>
        <h3>${esc(b.name)}</h3>
        <dl>
          <dt>${b.category==="와인"?"생산연도":b.category==="꼬냑"?"원액 등급":"숙성연수"}</dt><dd>${esc(b.age)}${b.ageEstimated ? `<span class="est">추정</span>` : ""}</dd>

        </dl>
        <p class="note">${esc(b.notes)}</p>
        ${b.story ? `<p class="story"><span>배경</span>${esc(b.story)}</p>` : ""}
      </div>
    </article>`;
}

// 같은 등급(rank)이면 유통연대가 오래된 병이 위로. era 글에서 대략의 연도를 뽑아 비교합니다.
function eraYear(b){
  const e = String(b.era || "");
  if (/이전/.test(e)) { const m = e.match(/(\d{4})/); return m ? +m[1] - 1 : 9999; }
  const ys = [...e.matchAll(/(\d{4})|~\s*(\d{2})(?!\d)/g)].map(m => m[1] ? +m[1] : Math.floor((ys0(e)) / 100) * 100 + +m[2]);
  if (!ys.length) return 9999;
  if (!/년대/.test(e)) return ys[0];
  let y = ys.reduce((s, v) => s + v, 0) / ys.length + 5;
  if (/년대 초/.test(e)) y -= 3; else if (/년대 (중후반|후반)/.test(e) && ys.length === 1) y += 2;
  return y;
}
function ys0(e){ const m = e.match(/(\d{4})/); return m ? +m[1] : 0; }

    const items = groups[br].slice().sort((x, y) => (y.rank - x.rank) || (eraYear(x) - eraYear(y)));

}

const PARTICLES = ["으로","에서","이랑","하고","까지","부터","은","는","이","가","을","를","로","에","도","만","랑","과","의"];
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").normalize("NFC");

function expand(tok){
  const t = norm(tok); const out = new Set([t]);
  SYNONYMS.forEach(g => { const ng = g.map(norm); if (ng.some(w => w === t || (!t.includes(" ") && ((t.length >= 2 && w.startsWith(t)) || (w.length >= 2 && !w.includes(" ") && t.startsWith(w)))))) ng.forEach(w => out.add(w)); });
  return [...out];
}
function tokenize(q){
  let s = " " + norm(q).replace(/[?!.,·]/g," ") + " ";
  const multi = SYNONYMS.flat().map(norm).filter(w => w.includes(" ")).sort((a,b)=>b.length-a.length);
  const toks = [];
  multi.forEach(w => { if (s.includes(" "+w+" ") || s.includes(" "+w)) { toks.push(w); s = s.split(w).join(" "); } });
  s.split(/\s+/).filter(Boolean).forEach(w => {
    if (/^(19|20)\d\d년?$/.test(w)) { toks.push(w.replace("년","")); return; }
    if (/^\d/.test(w) || STOP.has(w)) return;
    for (const p of PARTICLES) if (w.length > p.length + 1 && w.endsWith(p)) { const st = w.slice(0, -p.length); if (expand(st).length > 1 || SEARCH_TEXT.some(x => x.includes(st))) { w = st; break; } }
    if (!STOP.has(w)) toks.push(w);
  });
  return toks;
}
function localSearch(q){
  const nq = norm(q);
  let ageCond = null;
  const am = nq.match(/(\d+)\s*(년|years?|yo\b|y\b)/) || nq.match(/(?:over|under|than|below|above)\s*(\d+)/) || nq.match(/(\d+)\s*(?:이상|이하|미만|넘)/);
  if (am && +am[1] < 1000) { const n = +am[1]; ageCond = { n, op: /(이상|넘|over|more than|above|or more|\+|plus)/.test(nq) ? ">=" : /(이하|미만|under|below|less than)/.test(nq) ? "<=" : "=" }; }
  const toks = tokenize(q);
  const unknown = [], used = [];
  toks.forEach(t => { const syn = expand(t); if (SEARCH_TEXT.some(x => syn.some(w => x.includes(w)))) used.push(syn); else unknown.push(t); });
  const r1 = rank(used, ageCond, true);
  const res = r1.ids.length && !r1.partial ? r1 : rank(used, ageCond, false);
  return { ...res, unknown, empty: !used.length && !ageCond };
}
const CATRULES = [["와인", c => c === "와인"], ["꼬냑", c => c === "꼬냑"], ["싱글몰트", c => c === "싱글몰트 위스키"], ["블렌디드", c => c === "블렌디드 위스키"], ["위스키", c => c.includes("위스키")], ["증류주", c => c === "기타 증류주"]];
function rank(used, ageCond, strictCat){
  let scored = BOTTLES.map((b, i) => {
    let hit = used.filter(syn => { const rule = strictCat && CATRULES.find(([k]) => syn.includes(k)); return rule ? rule[1](b.category) : syn.some(w => SEARCH_TEXT[i].includes(w)); }).length;
    let ageOk = true;
    if (ageCond) { const n = ageNum(b); ageOk = n !== null && (ageCond.op === ">=" ? n >= ageCond.n : ageCond.op === "<=" ? n <= ageCond.n : (n === ageCond.n || String(b.age).includes(ageCond.n) || b.name.includes(String(ageCond.n)))); }
    return { i, hit, ageOk };
  }).filter(r => r.ageOk);
  const need = used.length;
  let exact = scored.filter(r => r.hit === need);
  let partial = false;
  if (!exact.length && need) { const max = Math.max(0, ...scored.map(r => r.hit)); if (max > 0) { exact = scored.filter(r => r.hit === max); partial = true; } }
  if (!need && !ageCond) exact = [];
  exact.sort((a, b) => BOTTLES[b.i].rank - BOTTLES[a.i].rank);
  return { ids: exact.map(r => r.i), partial };
}

// ── AI 모드 (선택): 본인의 Anthropic API 키로 Claude에게 직접 질문 ──
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return store._m[k] || null; } }, set(k,v){ try { v===null?localStorage.removeItem(k):localStorage.setItem(k,v); } catch(e){ store._m[k]=v; } }, _m:{} };
const CATALOG = BOTTLES.map((b,i) => [i,b.category,b.brand,b.name,b.age,b.era,b.notes,b.story||""].join(" | ")).join("\n");
let chatHistory = [];
async function aiSearch(q){
  const key = store.get("liquorApiKey");
  const sys = "너는 사용자의 개인 술장(아래 목록)을 안내하는 도우미다. 질문은 한국어나 영어로 온다. 반드시 목록에 있는 병만 근거로 답하고, 없는 병을 지어내지 마라. 답은 질문 언어로 2~3문장 이내. 오직 JSON 한 개만 출력: {\"answer\":\"...\",\"ids\":[번호,...]} (ids는 관련 병 번호, 관련도 순, 최대 20개, 없으면 []).\n\n번호 | 종류 | 브랜드 | 이름 | 숙성/등급/연도 | 유통연대 | 설명 | 배경\n" + CATALOG;
  const messages = chatHistory.slice(-6).concat([{ role: "user", content: q }]);
  const r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" }, body: JSON.stringify({ model: "claude-haiku-4-5", max_tokens: 700, system: sys, messages }) });
  if (!r.ok) throw new Error(r.status === 401 ? "API 키가 올바르지 않아요." : "AI 응답 오류 (" + r.status + ")");
  const data = await r.json();
  const text = (data.content || []).map(c => c.text || "").join("");
  const m = text.match(/\{[\s\S]*\}/);
  const out = m ? JSON.parse(m[0]) : { answer: text, ids: [] };
  chatHistory.push({ role: "user", content: q }, { role: "assistant", content: text });
  return { answer: out.answer || "", ids: (out.ids || []).filter(i => BOTTLES[i]) };
}

<button id="chat-fab" aria-label="술장 검색 열기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>술장 검색</button>
<section id="chat" hidden aria-label="술장 검색">
  <header><b>술장 검색</b><span id="chat-mode"></span><button id="chat-set" aria-label="AI 설정">AI 설정</button><button id="chat-x" aria-label="닫기">✕</button></header>
  <div id="chat-settings" hidden>
    <p>AI 모드는 본인의 Anthropic API 키로 Claude에게 직접 묻는 방식이에요. 키는 이 기기 브라우저에만 저장되고 다른 곳으로 보내지지 않아요. 질문 한 번에 약 10원 정도 들어요.</p>
    <input id="chat-key" type="password" placeholder="sk-ant-..." autocomplete="off">
    <div class="row"><button id="chat-key-save">저장</button><button id="chat-key-del">키 삭제</button></div>
  </div>
  <div id="chat-log" aria-live="polite"></div>
  <div id="chat-chips"></div>
  <form id="chat-form"><input id="chat-in" placeholder="예: 셰리 캐스크 18년, Hennessy, 30년 이상" autocomplete="off" enterkeyhint="search"><button aria-label="보내기">↑</button></form>
</section>`);
const $ = id => document.getElementById(id);
const log = $("chat-log");
function updateMode(){ $("chat-mode").textContent = store.get("liquorApiKey") ? "AI 모드" : "기본 검색"; }
function say(html, who){ log.insertAdjacentHTML("beforeend", `<div class="msg ${who}">${html}</div>`); const el = log.lastElementChild; showTop(el); return el; }
function showTop(el){ log.scrollTop = Math.max(0, el.offsetTop - log.offsetTop - 8); }
function resultList(ids){
  if (!ids.length) return "";
  const show = ids.slice(0, 30);
  return `<ul class="hits">${show.map(i => { const b = BOTTLES[i]; return `<li><button data-i="${i}">${b.image ? `<img src="${b.image}" alt="">` : ""}<span><b>${esc(b.name)}</b><small>${esc(b.category)} · ${esc(b.age)}</small></span></button></li>`; }).join("")}</ul>${ids.length > 30 ? `<p class="more">외 ${ids.length - 30}병 더 있어요. 조건을 좁혀 보세요.</p>` : ""}`;
}
async function ask(q){
  q = q.trim(); if (!q) return;
  say(esc(q), "me"); $("chat-in").value = ""; $("chat-chips").hidden = true;
  if (store.get("liquorApiKey")) {
    const wait = say("찾는 중…", "bot");
    try { const r = await aiSearch(q); wait.innerHTML = esc(r.answer) + resultList(r.ids); showTop(wait); return; }
    catch (e) { wait.innerHTML = (/^(API|AI)/.test(e.message) ? esc(e.message) : "AI에 연결하지 못했어요.") + " 기본 검색으로 찾을게요."; }
  }
  const r = localSearch(q);
  let msg;
  if (r.empty) msg = "브랜드, 종류, 숙성연수, 캐스크 같은 단어로 물어봐 주세요. 예: '맥캘란 셰리', 'cognac XO', '20년 이상 블렌디드'";
  else if (!r.ids.length) msg = "술장에서 맞는 병을 찾지 못했어요." + (r.unknown.length ? ` ('${esc(r.unknown.join("', '"))}'는 목록에 없는 표현이에요.)` : "");
  else msg = `${r.partial ? "모든 조건에 맞는 병은 없어서 가장 가까운 병을 보여드려요. " : ""}${r.ids.length}병을 찾았어요.` + (r.unknown.length ? ` ('${esc(r.unknown.join("', '"))}'는 찾지 못해 빼고 검색했어요.)` : "");
  say(msg + resultList(r.ids), "bot");
}
function jump(i){
  const el = document.getElementById("b" + i); if (!el) return;
  for (let p = el.parentElement; p; p = p.parentElement) if (p.tagName === "DETAILS") p.open = true;
  if (matchMedia("(max-width:700px)").matches) $("chat").hidden = true;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
$("chat-fab").onclick = () => { $("chat").hidden = false; updateMode(); if (!log.children.length) say("영어나 한국어로 물어보세요. 술장에서 맞는 병을 찾아 드려요. 결과를 누르면 해당 병으로 이동해요.", "bot"); $("chat-in").focus(); };
$("chat-x").onclick = () => { $("chat").hidden = true; };
$("chat-set").onclick = () => { $("chat-settings").hidden = !$("chat-settings").hidden; };
$("chat-key-save").onclick = () => { const v = $("chat-key").value.trim(); if (!/^sk-ant-/.test(v)) { $("chat-key").setCustomValidity("sk-ant- 로 시작하는 키를 넣어 주세요"); $("chat-key").reportValidity(); return; } store.set("liquorApiKey", v); $("chat-key").value = ""; $("chat-settings").hidden = true; updateMode(); say("AI 모드를 켰어요. 이제 '선물하기 좋은 꼬냑'처럼 자유롭게 물어보셔도 돼요.", "bot"); };
$("chat-key").oninput = () => $("chat-key").setCustomValidity("");
$("chat-key-del").onclick = () => { store.set("liquorApiKey", null); chatHistory = []; $("chat-settings").hidden = true; updateMode(); say("API 키를 지우고 기본 검색으로 돌아왔어요.", "bot"); };
$("chat-form").onsubmit = e => { e.preventDefault(); ask($("chat-in").value); };
log.onclick = e => { const b = e.target.closest("button[data-i]"); if (b) jump(+b.dataset.i); };
$("chat-chips").innerHTML = ["셰리 캐스크 18년", "Hennessy", "30년 이상 위스키", "Japanese whisky", "와인"].map(t => `<button>${t}</button>`).join("");
$("chat-chips").onclick = e => { if (e.target.tagName === "BUTTON") ask(e.target.textContent); };
</script>
</body>
</html>
